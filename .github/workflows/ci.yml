name: CI

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          cache: true

      - run: vp check
      - run: vp test
      - run: google-chrome --version
      - run: vp run test:browser
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
      - run: vp run build
      - name: Publish preview package
        # Ecosystem smoke test: publishing needs credentials unavailable on the fork.
        if: ${{ (github.event_name != 'workflow_dispatch') && github.repository_owner != 'vite-plus-ecosystem-ci' }}
        run: vp dlx pkg-pr-new publish --compact ./packages/vue-clamp
      - name: Deploy website to Void
        # Ecosystem smoke test: publishing needs credentials unavailable on the fork.
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && github.repository_owner != 'vite-plus-ecosystem-ci' }}
        working-directory: packages/website
        run: vp exec void deploy --skip-build --project vue-clamp
