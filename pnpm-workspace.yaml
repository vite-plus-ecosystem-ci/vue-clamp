packages:
  - packages/*
  - tools/*
allowBuilds:
  # Version 13 ships native prebuilds and declares gypfile: false.
  better-sqlite3: false
  esbuild: true
  sharp: true
  workerd: true

catalog:
  "@chenglou/pretext": 0.0.9
  "@lucide/vue": ^1.39.0
  "@types/node": ^26.4.1
  "@types/stats.js": ^0.17.4
  "@vitejs/plugin-vue": ^6.0.8
  "@vitest/browser-playwright": 5.0.5
  "@vue-macros/define-render": ^3.1.4
  "@vue/compiler-dom": ^3.5.42
  "@vue/compiler-sfc": ^3.5.42
  bumpp: ^12.2.3
  overlayscrollbars: ^2.15.1
  playwright: ^1.62.1
  releaselog: ^8.1.0
  shiki: ^4.4.3
  simple-icons: ^16.29.0
  stats.js: ^0.17.0
  typescript: npm:typescript-native-bridge@6.0.3-bridge.18.tsgo.7.0.2
  unplugin-vue: ^8.0.0
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.6a30b43184ad1c159091d51d728ee8c249392aa1
  vite-plus: 0.0.0-commit.6a30b43184ad1c159091d51d728ee8c249392aa1
  void: 0.25.0
  vue: ^3.5.42
  vue-tsc: ^3.3.11
  vitest: 5.0.5

catalogMode: prefer

minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - "@voidzero-dev/*"
  - "@oxc-project/*"
  - oxlint
  - "@oxlint/*"
  - oxfmt
  - "@oxfmt/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - vitest
  - "@vitest/*"
  - tinybench
  - yuku-core
  - yuku-parser
  - "@yuku-core/*"
  - "@yuku-toolchain/*"
  - "@voidzero-dev/vite-plus-core@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0"
  - vite-plus@1.0.0
overrides:
  typescript: npm:typescript-native-bridge@6.0.3-bridge.18.tsgo.7.0.2
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
